name: Qobuz Client Checks

on:
  pull_request:
    paths:
      - "Apollo/Core/MusicSources/**"
      - "tests/MusicSources/QobuzClientChecks.swift"
      - "scripts/test-qobuz-client.sh"
      - ".github/workflows/qobuz-client-checks.yml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Qobuz parsing, signatures and sample rejection
        run: bash scripts/test-qobuz-client.sh
