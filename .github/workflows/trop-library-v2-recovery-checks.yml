name: Trop Library V2 Recovery Checks

on:
  pull_request:
    paths:
      - "Trop/Core/LibrarySync/TropLibraryV2RecoveryArchive.swift"
      - "Trop/Core/LibrarySync/TropLibraryBackupArchive.swift"
      - "Trop/Core/LibrarySync/TropLibraryBackupService.swift"
      - "Trop/Core/LibrarySync/TropLibraryCombinedBackupArchive.swift"
      - "Trop/Core/LibrarySync/TropLibraryCombinedBackupService.swift"
      - "Trop/Core/LibrarySync/TropLibraryCombinedRestorePlanner.swift"
      - "Trop/Core/LibrarySync/TropLibraryCombinedRestorePreflight.swift"
      - "tests/LibrarySync/TropLibraryCombinedBackupArchiveChecks.swift"
      - "Trop/Core/LibrarySync/TropLibraryV2RecoveryStore.swift"
      - "Trop/Core/LibrarySync/TropLibraryV2IdentityPolicy.swift"
      - "Trop/Settings/TropLibraryV2RecoveryView.swift"
      - "Trop/Resources/Info.plist"
      - "Trop/Settings/SettingsView.swift"
      - "tests/LibrarySync/TropLibraryV2RecoveryArchiveChecks.swift"
      - "scripts/test-trop-library-v2-recovery.sh"
      - "scripts/test-trop-library-v2-grdb-integration.sh"
      - "tests/LibrarySync/V2RecoveryGRDB/**"
      - "Trop/Database/DatabaseMigrations.swift"
      - ".github/workflows/trop-library-v2-recovery-checks.yml"
  workflow_dispatch:

jobs:
  recovery:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run V2 archive integrity and SQLite recovery fixtures
        run: bash scripts/test-trop-library-v2-recovery.sh

  grdb-roundtrip:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Exercise production V2 store against real GRDB 7.12
        run: bash scripts/test-trop-library-v2-grdb-integration.sh
