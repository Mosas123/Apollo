name: Music Sync & Import Replay Checks

on:
  pull_request:
    paths:
      - "Trop/Core/LibrarySync/**"
      - "tests/LibrarySync/MusicSyncPlannerChecks.swift"
      - "scripts/test-music-sync.sh"
      - ".github/workflows/music-sync-checks.yml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check loop prevention, account isolation, outbox and import replay safety
        run: bash scripts/test-music-sync.sh
