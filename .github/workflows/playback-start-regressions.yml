name: Playback Start Regression Checks

on:
  pull_request:
    paths:
      - "Trop/Audio/PlaybackIntentGuard.swift"
      - "Trop/Audio/PlayerController/PlayerController.swift"
      - "Trop/Audio/PlayerController/AudioRouteChangePolicy.swift"
      - "Trop/Audio/PlayerController/ApoloFiniteAudioWatchdog.swift"
      - "Trop/Audio/NowPlaying.swift"
      - "Trop/Audio/PlaybackQueue.swift"
      - "Trop/Playback/PlaybackStateService.swift"
      - "Trop/Playback/ListeningTimeAccumulator.swift"
      - "Trop/SponsorBlock/SponsorBlockSkipPolicy.swift"
      - "Trop/SponsorBlock/SponsorBlockIntegration.swift"
      - "tests/Playback/**"
      - ".github/workflows/playback-start-regressions.yml"

jobs:
  guards:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run real app playback policies
        run: |
          set -euo pipefail
          swiftc \
            Trop/Audio/PlaybackIntentGuard.swift \
            Trop/Playback/ListeningTimeAccumulator.swift \
            Trop/Audio/PlayerController/ApoloFiniteAudioWatchdog.swift \
            Trop/SponsorBlock/SponsorBlockSkipPolicy.swift \
            tests/Playback/PlaybackGuardChecks.swift \
            tests/Playback/ListeningTimeChecks.swift \
            -o "$RUNNER_TEMP/playback-guard-checks"
          "$RUNNER_TEMP/playback-guard-checks"
      - name: Verify list and playlist taps use protected queue start
        run: |
          set -euo pipefail
          grep -Fq 'NowPlaying.shared.playCurrentSong(logContext: context)' Trop/Audio/PlaybackQueue.swift
          if grep -Fq 'loggedTask(log, "\(context) failed")' Trop/Audio/PlaybackQueue.swift; then
            echo "PlaybackQueue must not use unhandled fire-and-forget playlist resolution"
            exit 1
          fi
      - name: Verify headphone handoff and iOS interruption recovery policies
        run: |
          set -euo pipefail
          swiftc \
            Trop/Audio/PlayerController/AudioRouteChangePolicy.swift \
            tests/Playback/AudioRouteChangeChecks.swift \
            -o "$RUNNER_TEMP/audio-route-change-checks"
          "$RUNNER_TEMP/audio-route-change-checks"
