name: Radio Advanced Regression Checks

on:
  pull_request:
    paths:
      - "Apollo/Core/Radio/**"
      - "Apollo/Audio/NowPlaying.swift"
      - "Apollo/Features/Radio/RadioView.swift"
      - "tests/Radio/**"
      - ".github/workflows/radio-advanced-regressions.yml"
  workflow_dispatch:

jobs:
  radio-advanced:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run offline radio transport, parser and identity regression tests
        run: |
          set -euo pipefail
          swiftc \
            Apollo/Core/Radio/RadioBrowser.swift \
            Apollo/Core/Radio/RadioTransportResolver.swift \
            Apollo/Core/Radio/ICYTitleParser.swift \
            Apollo/Core/Radio/RadioMetadataProviders.swift \
            tests/Radio/RadioAdvancedChecks.swift \
            -o "$RUNNER_TEMP/radio-advanced-checks"
          "$RUNNER_TEMP/radio-advanced-checks"
