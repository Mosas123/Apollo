name: Nightly Build

on:
  push:
    branches:
      - main
  # Also build stacked PRs targeting feature branches.
  pull_request:
  workflow_dispatch:

concurrency:
  # PRs each get their own group so they do not cancel one another
  group: trop-nightly-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: true

env:
  FFMPEG_KIT_TAG: v9.0.2

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-26
    # Skip bot commits created by release publishing.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       !contains(github.event.head_commit.message, '[skip ci]'))
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Cache ffmpeg-kit XCFrameworks
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-kit-xcframeworks
          key: ffmpeg-kit-${{ env.FFMPEG_KIT_TAG }}-arm64+sim-openssl-${{ runner.os }}

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: build/DerivedDataApp
          key: trop-dd-${{ runner.os }}-${{ hashFiles('Trop.xcodeproj/**', '**/Package.resolved', 'Trop/**/*.swift') }}
          restore-keys: |
            trop-dd-${{ runner.os }}-

      - name: Make build script executable
        run: chmod +x ./build_ipa.sh

      - name: Build iOS IPA
        run: ./build_ipa.sh
        env:
          FFMPEG_KIT_TAG: ${{ env.FFMPEG_KIT_TAG }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Trop-iOS
          path: build/Trop.ipa

      - name: Publish safe area test release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/safe-area-display'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create safe-area-test-${{ github.run_number }} build/Trop.ipa \
            --target "$GITHUB_SHA" --prerelease --title "Prueba de pantalla completa" \
            --notes "Compilación de prueba del ajuste de áreas seguras. Requiere comprobarse en un iPhone. IPA sin firmar."

      - name: Publish nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          IPA_PATH="build/Trop.ipa"
          test -f "$IPA_PATH"

          # GitHub immutable releases forbid deleting/replacing existing assets.
          # Give each successful run (including reruns) a unique prerelease tag.
          RELEASE_TAG="nightly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          NOTES="$(printf '%s' "$COMMIT_SUBJECT" | head -n 1 | tr -d '\r')"
          if [ -z "$NOTES" ]; then
            NOTES="Nightly build #${RUN_NUMBER}"
          fi

          gh release create "$RELEASE_TAG" "$IPA_PATH" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly #${RUN_NUMBER} (attempt ${GITHUB_RUN_ATTEMPT})" \
            --notes "Built from main at ${GITHUB_SHA}. ${NOTES} (real)"
