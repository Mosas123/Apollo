name: Music Addon Foundation Checks

on:
  pull_request:
    paths:
      - "Apollo/Core/MusicAddons/**"
      - "tests/MusicAddons/**"
      - "scripts/test-music-addons.sh"
      - ".github/workflows/music-addons-checks.yml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate addon manifests, permissions and registry logic
        run: bash scripts/test-music-addons.sh
