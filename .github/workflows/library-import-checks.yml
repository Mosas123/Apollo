name: Library Import Planner Checks

on:
  pull_request:
    paths:
      - "Trop/Core/LibrarySync/**"
      - "tests/LibrarySync/**"
      - "scripts/test-library-import.sh"
      - ".github/workflows/library-import-checks.yml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify account isolation, deduplication and dry-run import planning
        run: bash scripts/test-library-import.sh
