name: Addon Quality Policy Checks

on:
  pull_request:
    paths:
      - "Trop/Core/MusicAddons/AddonStreamQualityPolicy.swift"
      - "Trop/Core/MusicAddons/MusicAddonClient.swift"
      - "Trop/Core/MusicAddons/AddonSourceResolver.swift"
      - "Trop/Audio/PlaybackManager.swift"
      - "Trop/Settings/MusicQualityMode.swift"
      - "Trop/Settings/SettingsStore.swift"
      - "tests/MusicAddons/AddonQualityPolicyChecks.swift"
      - "scripts/test-addon-quality-policy.sh"
      - ".github/workflows/addon-quality-policy-checks.yml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test safe addon quality limits
        run: bash scripts/test-addon-quality-policy.sh
