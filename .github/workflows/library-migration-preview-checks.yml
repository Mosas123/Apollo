name: Library Migration Read-only Preview Checks

on:
  pull_request:
    paths:
      - "Trop/Core/LibrarySync/TropLibraryMigrationPreview.swift"
      - "Trop/Settings/TropLibraryMigrationPreviewView.swift"
      - "Trop/Settings/SettingsView.swift"
      - "scripts/test-library-migration-preview.sh"
      - ".github/workflows/library-migration-preview-checks.yml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify no mutations and accurate local counts
        run: bash scripts/test-library-migration-preview.sh
